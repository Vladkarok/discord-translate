name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/agent/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.codex/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (must already exist in GHCR). Default 'latest' redeploys the latest pushed image."
        required: false
        default: 'latest'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-discord-translate
  cancel-in-progress: false

jobs:
  build:
    name: Build and push image
    if: github.repository == 'Vladkarok/discord-translate' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image vars
        id: vars
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          BASE="ghcr.io/${OWNER}/discord-translate"
          echo "REPO_OWNER_LC=${OWNER}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${BASE}:${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${BASE}:latest" >> "$GITHUB_ENV"
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_LATEST }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    if: |
      always() && github.repository == 'Vladkarok/discord-translate' && (
        (github.event_name == 'push' && needs.build.result == 'success') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: [self-hosted, Linux, X64, disctrans]
    needs: [build]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ needs.build.outputs.image_tag }}"
          fi
          echo "REPO_OWNER_LC=${OWNER}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ env.REPO_OWNER_LC }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_SSH_ALIAS: disctrans-vprojects
          DEPLOY_APP_DIR: /home/vladkarok/apps/discord-translate
        run: bash scripts/deploy.sh
