name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/agent/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.codex/**'
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check
